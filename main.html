<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where'd It Go — Payment Tracker</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="main.css">


</head>
<body>

<div class="hero">
  <div class="eyebrow">Payment Tracker</div>
  <h1 class="m-0">Where Your Money Go</h1>
  <div class="total mono" id="totalDisplay">$0.00</div>
  <div class="sub" id="countDisplay">0 payments logged</div>
</div>
<div class="container py-4">
  <div class="row g-4">

    <!-- Add payment form -->
<div class="col-lg-4">
      <div class="panel h-100">
        <div class="section-title">Log a payment</div>
        <form id="paymentForm">
          <div class="mb-3">
            <label class="form-label">What was it for?</label>
            <input type="text" class="form-control" id="descInput" placeholder="Coffee, rent, groceries..." required>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" min="0" class="form-control mono" id="amountInput" placeholder="0.00" required>
          </div>
<div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="categoryInput">
              <option value="Food">Food</option>
              <option value="Rent">Rent</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Fun">Fun</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" id="dateInput">
          </div>
          <button type="submit" class="btn btn-amber w-100"  id="addBt">Add payment</button>
        </form>
        <button class="btn btn-outline-cream w-100 mt-2" id="exportBtn">Export as PDF</button>
        
      </div>
</div>

    <!-- Receipt list -->
<div class="col-lg-5">
      <div class="panel h-100">
        <div class="d-flex justify-content-between align-items-center">
          <div class="">Your Payment</div>
          <button class="btn btn-sm btn-outline-cream" id="clearBtn">Clear all</button>
        </div>
        <div class="receipt" id="receiptList">
          <div class="empty-state" id="state-tittle">Nothing logged yet  add your first payment.</div>
        </div>
      </div>
</div>


<script src="main.js"> </script>

</body>
</html>
